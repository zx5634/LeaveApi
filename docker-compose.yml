services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      TZ: Asia/Taipei
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_SERVER_MODE: "False"       # 單機模式，不需要登入
      TZ: Asia/Taipei
    ports:
      - "15050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - db_network
    depends_on:
      postgres:
        condition: service_healthy    # 確保 DB 健康檢查成功後，GUI 才會啟動
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["5000:8080"]    # 主機 5000 對應容器 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - EnableHttpsRedirection=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mydb};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-changeme};
    networks:
      - db_network
    depends_on:
      postgres:
        condition: service_healthy    # 確保 DB 健康檢查成功後，API 才會啟動
volumes:
  postgres_data:
  pgadmin_data:

networks:
  db_network:
    driver: bridge
